bind 0.0.0.0
port 6379

# Memory policy (keep same behavior as before)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persist data to disk so Redis survives restart/recreate
dir /data

# AOF persistence (recommended for durability)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Also keep periodic RDB snapshots as a fallback
save 900 1
save 300 10
save 60 10000

# Useful in container environments
protected-mode no
