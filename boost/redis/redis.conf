bind 0.0.0.0
port 6379

# UPGRADED: Increased max clients to support high concurrency
# Application pool: 2048 connections
# Allow headroom for other clients (batch, monitoring, etc.)
maxclients 5000

# UPGRADED: Increased memory for larger connection pool
# Each connection ~1MB, 2048 connections = ~2GB
# Plus data storage, set to 4GB total
maxmemory 4gb
maxmemory-policy allkeys-lru

# TCP settings for better connection handling
tcp-backlog 511
tcp-keepalive 300
timeout 0

# Persist data to disk so Redis survives restart/recreate
dir /data

# AOF persistence (recommended for durability)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Also keep periodic RDB snapshots as a fallback
save 900 1
save 300 10
save 60 10000

# Useful in container environments
protected-mode no
