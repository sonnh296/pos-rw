server:
  port: 8080

spring:
  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  autoconfigure:
    exclude: []
      # - org.redisson.spring.starter.RedissonAutoConfigurationV2 (Enabled)

  # Redisson Configuration (Standard Starter Way)
  redis:
    redisson:
      config:
        singleServerConfig:
          address: "redis://${spring.data.redis.host:localhost}:${spring.data.redis.port:6379}"
          connectionPoolSize: 2048
          connectionMinimumIdleSize: 256
          idleConnectionTimeout: 30000
          connectTimeout: 5000
          timeout: 3000
          retryAttempts: 2
          retryInterval: 1000

logging:
  level:
    turbo.pos.boost: DEBUG

# redis (default) | mysql-only — profile mysql-only bật sẵn trong application-mysql-only.yml
app:
  concurrency:
    enabled: true
    max-concurrent-requests: 1500
    acquire-timeout-millis: 100
  sharding:
    enabled: false
    shard-count: 8
  executors:
    platform:
      size: 200
  demo:
    enabled: true
  admin:
    enabled: true
  diagnostics:
    reward-timing: false
    samples: 30
  benchmark:
    enabled: true
    max-requests-per-second: 10000
    max-duration-seconds: 120
    warmup-seconds: 10
    await-timeout-seconds: 1800
    ramp-default-levels: 500,1000,1500,2000,3000,4000,5000,6000,7000,8000,9000,10000
  rewards:
    mode: redis
    stub-redis: false
    use-lua: true
    optimized: true
    idempotency:
      ttl-days: 7
    lock:
      wait-millis: 5000
      lease-seconds: 30
      retry-delay-millis: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents,metrics
      cors:
        allowed-origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173"
        allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        allowed-headers: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: true
  metrics:
    export:
      simple:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      redisNoLock:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - turbo.pos.boost.exception.RedisUnavailableException
      redisLocking:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - turbo.pos.boost.exception.RedisUnavailableException
