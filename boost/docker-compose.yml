services:
  # Cấu hình Database (Giữ lại nếu chưa dùng AWS RDS)
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rewards
      MYSQL_USER: rewards
      MYSQL_PASSWORD: rewards
      MYSQL_ROOT_PASSWORD: root_change_me
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-proot_change_me",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Application - Backend Boost
  boost:
    build: .
    image: turbo-pos-boost:latest
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Kết nối tới Amazon ElastiCache (Truyền Endpoint qua biến môi trường hoặc ghi đè tại đây)
      - REDISSON_ADDRESS=${REDISSON_ADDRESS:-redis://localhost:6379}
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST:-localhost}
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/rewards?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=rewards
      - SPRING_DATASOURCE_PASSWORD=rewards
      - JAVA_OPTS=-Xmx1024m -Xms512m

  # Application - Batch Processing
  rewards-batch:
    build: ./rewards-batch
    image: turbo-pos-rewards-batch:latest
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      - REDISSON_ADDRESS=${REDISSON_ADDRESS:-redis://localhost:6379}
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST:-localhost}
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/rewards?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=rewards
      - SPRING_DATASOURCE_PASSWORD=rewards
      - JAVA_OPTS=-Xmx512m -Xms256m

# Đã loại bỏ Redis container vì sử dụng AWS ElastiCache managed service
