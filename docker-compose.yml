# Chạy full stack: docker compose up --build
# UI: http://localhost:5173  |  API: http://localhost:8080
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./boost/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli INFO persistence | grep -q 'loading:0' && redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 300s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rewards
      MYSQL_USER: rewards
      MYSQL_PASSWORD: rewards
      MYSQL_ROOT_PASSWORD: root_change_me
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_change_me"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  boost:
    build:
      context: .
      dockerfile: boost/Dockerfile
    image: turbo-pos-boost:latest
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rewards?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: rewards
      SPRING_DATASOURCE_PASSWORD: rewards
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      JAVA_OPTS: "-Xmx2048m -Xms1024m"

  rewards-batch:
    build:
      context: .
      dockerfile: rewards-batch/Dockerfile
    image: turbo-pos-rewards-batch:latest
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rewards?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: rewards
      SPRING_DATASOURCE_PASSWORD: rewards
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      JAVA_OPTS: "-Xmx512m -Xms256m"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: turbo-pos-frontend:latest
    depends_on:
      - boost
    ports:
      - "5173:80"

volumes:
  redis-data: {}
